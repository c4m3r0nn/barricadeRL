[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barricade-rl"
version = "0.1.0"
description = "Correctness-first Quoridor engine for AlphaZero self-play"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pyquoridor==0.0.5", "pytest>=8", "torch>=2.7,<3"]
training = ["torch>=2.7,<3"]

[project.scripts]
barricade-benchmark = "barricade_rl.benchmark:main"
barricade-dashboard = "barricade_rl.dashboard:main"
barricade-evaluate = "barricade_rl.evaluate:main"
barricade-generate-5x5-oracle = "barricade_rl.oracle5x5:main"
barricade-gate-az = "barricade_rl.az_gating:main"
barricade-run-az-cycle = "barricade_rl.az_pipeline:main"
barricade-training-readiness = "barricade_rl.training_readiness:main"
barricade-train-az = "barricade_rl.az_learner:main"
barricade-train-dqn = "barricade_rl.baseline_dqn:main"
barricade-verify = "barricade_rl.verify:main"

[tool.setuptools.packages.find]
include = ["barricade_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
