name: CI

on:
  push:
  pull_request:

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python -m pip install -e '.[dev]'
      - run: cargo build --release
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: python -m pytest -q
      - run: barricade-verify --games 10000 --differential-states 10000 --external-games 10000 --seed 0
      - run: barricade-benchmark --plies 100000
